name: upstream to PR

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs: {}

permissions:
  issues: write
  pull-requests: write

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - name: Open PR from zmkfirmware:main
        id: pr
        shell: bash
        env:
          # PAT so the PR triggers pull_request workflows; GITHUB_TOKEN-created PRs don't
          GH_TOKEN: ${{ secrets.PAT }}
          BASE: ${{ github.event.repository.default_branch }}
          BODY: |
            Integrating latest changes from [zmkfirmware/unified-zmk-config-template](https://github.com/zmkfirmware/unified-zmk-config-template) main.

            > [!WARNING]
            > Merge with **Create a merge commit**. Squash or rebase leaves upstream's commits out of `main`, so this PR reopens on the next run.
        run: |
          # head lives in the parent repo, so nothing is pushed to this fork
          if out=$(gh api "repos/$GITHUB_REPOSITORY/pulls" \
              -f head=zmkfirmware:main \
              -f base="$BASE" \
              -f title="Upstream zmkfirmware/unified-zmk-config-template main" \
              -f body="$BODY" \
              --jq .number 2>&1); then
            echo "Pull request created: #$out"
            echo "number=$out" >> "$GITHUB_OUTPUT"
          elif grep -qE 'A pull request already exists|No commits between' <<<"$out"; then
            echo "$out"
          else
            echo "$out" >&2
            exit 1
          fi

      - name: Assign PR
        if: steps.pr.outputs.number
        env:
          # PAT acts as me, and GitHub doesn't notify about my own actions
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/assignees" \
            -f "assignees[]=$GITHUB_REPOSITORY_OWNER" --silent
